<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Website Logo / Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO TITLE -->
    <title>Adonay TikTok Academy | TikTok & Content Creation Academy</title>

    <!-- SEO DESCRIPTION -->
    <meta
      name="description"
      content="Adonay TikTok Academy is a platform for learning TikTok content creation, video production, social media growth, personal branding, digital marketing, and becoming a successful content creator."
    />

    <!-- SEO KEYWORDS -->
    <meta
      name="keywords"
      content="Adonay TikTok Academy, TikTok Academy, TikTok training, TikTok Ethiopia, TikTok content creation, TikTok marketing, content creator training, social media training, video editing, video production, personal branding, digital marketing, content creation Ethiopia"
    />

    <!-- AUTHOR -->
    <meta name="author" content="Adonay TikTok Academy" />

    <!-- THEME COLOR -->
    <meta name="theme-color" content="#030712" />

    <!-- OPEN GRAPH (SOCIAL MEDIA PREVIEW) -->
    <meta
      property="og:title"
      content="Adonay TikTok Academy | TikTok & Content Creation Academy"
    />

    <meta
      property="og:description"
      content="Learn TikTok content creation, video production, social media growth, personal branding, and digital content creation with Adonay TikTok Academy."
    />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="/logo.svg" />

    <!-- URL -->
    <meta property="og:url" content="https://yourdomain.com" />

    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Adonay TikTok Academy | TikTok & Content Creation"
    />

    <meta
      name="twitter:description"
      content="Learn TikTok content creation, video production, social media growth, personal branding, and digital content creation."
    />

    <meta name="twitter:image" content="/logo.svg" />

    <!-- APPLE ICON -->
    <link rel="apple-touch-icon" href="/logo.svg" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
