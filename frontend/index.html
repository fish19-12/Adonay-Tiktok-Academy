<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <!-- Main browser favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Modern PNG favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- Apple / iPhone / iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =====================================================
         SEO
    ====================================================== -->

    <title>Adonay TikTok Academy | TikTok & Content Creation Academy</title>

    <meta
      name="description"
      content="Adonay TikTok Academy helps creators, entrepreneurs, professionals, and real estate agents build their personal brand, create powerful short-form content, and grow online."
    />

    <meta
      name="keywords"
      content="Adonay TikTok Academy, TikTok Academy, TikTok training, TikTok Ethiopia, TikTok content creation, TikTok marketing, content creator training, social media training, video editing, personal branding, digital marketing, real estate content creation"
    />

    <meta name="author" content="Adonay TikTok Academy" />

    <!-- =====================================================
         THEME
    ====================================================== -->

    <meta name="theme-color" content="#050505" />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:title"
      content="Adonay TikTok Academy | TikTok & Content Creation"
    />

    <meta
      property="og:description"
      content="Learn TikTok content creation, personal branding, short-form video, and digital growth with Adonay TikTok Academy."
    />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="/favicon.png" />

    <meta property="og:url" content="https://yourdomain.com" />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Adonay TikTok Academy | TikTok & Content Creation"
    />

    <meta
      name="twitter:description"
      content="Learn TikTok content creation, personal branding, short-form video, and digital growth with Adonay TikTok Academy."
    />

    <meta name="twitter:image" content="/favicon.png" />
  </head>
