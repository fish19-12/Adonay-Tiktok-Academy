services:
  - type: web
    name: adonay-tiktok-academy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: AdonayTiktokAcademyofficialBot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MINI_APP_URL
        value: https://www.adonaytiktokacademy.com/app
      - key: TELEGRAM_SUPPORT_USERNAME
        value: fera_tech
      - key: TELEGRAM_STUDENT_GROUP_ID
        sync: false
      - key: TELEGRAM_STUDENT_GROUP_URL
        sync: false
      - key: TELEGRAM_ANNOUNCEMENTS_CHANNEL_ID
        sync: false
      - key: TELEGRAM_ANNOUNCEMENTS_CHANNEL_URL
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: PAYMENT_AMOUNT_ETB
        value: "2500"
      - key: PAYMENT_ACCOUNT_NAME
        value: Adonay TikTok Academy
      - key: PAYMENT_CBE_ACCOUNT_NUMBER
        value: "1000457365344"
      - key: PAYMENT_TELEBIRR_NUMBER
        value: "0909567654"
      - key: PAYMENT_PROVIDER
        value: manual_review
      - key: PAYMENT_RECEIPTS_FOLDER
        value: adonay-tiktok-academy/payment-receipts
      - key: MAX_RECEIPT_SIZE_MB
        value: "5"
